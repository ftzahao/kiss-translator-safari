name: CI

# Proves that the repository builds from a clean checkout:
#   upstream checkout -> MV3 web extension -> XcodeGen project -> Release .app (unsigned)

"on":
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Must match upstream.pnpmVersion in config/build.config.mjs.
  # pnpm 10+ fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH against the upstream lockfile.
  PNPM_VERSION: "9.14.4"
  # Must match upstream.nodeMajor in config/build.config.mjs (currently 20).
  # Do not bump this alone: the pin, this value and the README's minimum all
  # have to move together, otherwise `make extension` aborts on a clean runner.
  NODE_VERSION: "20"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15
    # Hard ceiling; the build itself finishes well under this.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm`: there is no root pnpm-lock.yaml in this repository.

      - name: Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          node --version
          pnpm --version
          uname -m

      - name: Build web extension
        run: make extension

      - name: Build app (strict, unsigned)
        # `make build` regenerates the project, runs xcodebuild, and stages the
        # product at build/App/KISSTranslator.app — the same path release.yml and
        # scripts/package.mjs consume. Do NOT call xcodebuild directly here: that
        # leaves the app only in build/DerivedData/Build/Products/Release, and
        # the assertion step below (which checks the staged bundle) then fails
        # with "build/App/KISSTranslator.app missing" even though the build
        # succeeded.
        run: |
          mkdir -p build/logs
          make build SIGNING=0 2>&1 | tee build/logs/xcodebuild.log

      - name: Assert app bundle and embedded extension
        run: |
          set -euo pipefail
          APP="build/App/KISSTranslator.app"
          APPEX_NAMES=("KISSTranslator Extension.appex" "KISSTranslatorExtension.appex" "KISSTranslator.appex")

          test -d "${APP}" || {
            echo "::error::${APP} missing"
            # Distinguish "the build never staged the product" from "the product
            # is there but under a different path", so this failure is actionable.
            if [[ -d "build/DerivedData/Build/Products/Release/KISSTranslator.app" ]]; then
              echo "::error::xcodebuild succeeded but nothing staged the product at ${APP}; build via 'make build SIGNING=0' instead of calling xcodebuild directly."
            fi
            find build -maxdepth 4 -name '*.app' -print 2>/dev/null || true
            exit 1
          }

          APPEX=""
          for name in "${APPEX_NAMES[@]}"; do
            if [[ -d "${APP}/Contents/PlugIns/${name}" ]]; then APPEX="${APP}/Contents/PlugIns/${name}"; break; fi
          done
          if [[ -z "${APPEX}" ]]; then
            echo "::error::No .appex inside ${APP}/Contents/PlugIns"
            ls -la "${APP}/Contents/PlugIns" || true
            exit 1
          fi
          echo "Found extension: ${APPEX}"

          test -f "${APPEX}/Contents/Resources/manifest.json" || {
            echo "::error::manifest.json not found inside ${APPEX}"; exit 1;
          }
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (m.manifest_version !== 3) { console.error("::error::manifest_version is not 3"); process.exit(1); }
            console.log("manifest.json OK: version=" + m.version + " mv=" + m.manifest_version);
          ' "${APPEX}/Contents/Resources/manifest.json"

          lipo -info "${APP}" 2>/dev/null || true
          du -sh "${APP}"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/logs/**
            build/**/*.log
            build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned app on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/App
          if-no-files-found: ignore
          retention-days: 3
