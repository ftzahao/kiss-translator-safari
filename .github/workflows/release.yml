name: Release

# Builds a universal macOS build of the KISS Translator Safari Web Extension and
# attaches it to a GitHub Release.
#
# Triggers
#   - push of a tag matching `v*` (e.g. `v2.1.1`)  -> build + create release
#   - manual `workflow_dispatch`                  -> build + upload workflow artifacts

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create/update a GitHub Release for the tag (counterpart of a tag push). Leave false to only upload workflow artifacts."
        type: boolean
        default: false
      include_store_zip:
        description: "Also produce UNSIGNED-STORE-UPLOAD.zip (see job `store-zip`; not notarized, not App Store ready)."
        type: boolean
        default: true

# Never run two releases of the same tag at once; a newer run cancels an older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # Upstream pins pnpm 9.14.4 (see config/build.config.mjs -> upstream.pnpmVersion).
  # pnpm 10+ fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH against the upstream lockfile.
  PNPM_VERSION: "9.14.4"
  # Must match upstream.nodeMajor in config/build.config.mjs (currently 20).
  # Do not bump this alone: the pin, this value and the README's minimum all
  # have to move together, otherwise `make extension` aborts on a clean runner.
  NODE_VERSION: "20"
  # Unsigned / ad-hoc build flags shared by `make` and raw `xcodebuild` invocations.
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"

jobs:
  # ---------------------------------------------------------------------------
  # Primary job: unsigned DMG + ZIP for direct download from the Releases page.
  # ---------------------------------------------------------------------------
  build:
    name: Build (release artifacts)
    # macos-26 is GitHub's newest GA macOS runner image (there is no `macos-27`
    # label yet; `xcode-27` is a preview image). Its default Xcode is 26.x, which
    # ships the macOS 26 SDK — the compile-time opt-in for Liquid Glass on
    # macOS 26+. On a macos-15 runner the app is linked against the macOS 15 SDK
    # and keeps the pre-26 appearance no matter what the user's OS is.
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Intentionally no `cache: pnpm`: this repository has no root pnpm-lock.yaml.
          # Caching is handled inside the upstream work tree by the Makefile targets.

      - name: Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Assert Liquid Glass SDK
        # The Liquid Glass appearance is opted into at COMPILE time: the app and
        # the appex must be built against the macOS 26 SDK. The runner image
        # guarantees it (macos-26), but if GitHub ever moves the default Xcode
        # back, this fails loudly instead of silently shipping a pre-26 build.
        run: |
          set -euo pipefail
          echo "Booting with $(xcodebuild -version | head -1)"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK in use: ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            2[6-9].*|3[0-9].*) ;;
            *) echo "::error::macOS SDK ${SDK_VERSION} is too old to produce Liquid Glass; Xcode 26+ (macOS 26 SDK) is required"; exit 1 ;;
          esac

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -e 'import("./config/build.config.mjs").then(m => process.stdout.write(m.app.marketingVersion))')
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Convention: tag `vX.Y.Z` must match app.marketingVersion.
            if [[ "v${VERSION}" != "${TAG}" ]]; then
              echo "::error::Tag ${TAG} does not match app.marketingVersion ${VERSION} in config/build.config.mjs"
              exit 1
            fi
          fi
          echo "Building KISS Translator ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: make all SIGNING=0

      - name: Ad-hoc sign the app
        # `make all SIGNING=0` produces an unsigned .app. Ad-hoc signing (identity `-`)
        # does not require the owner's Developer ID; it only lets the app run once the
        # quarantine flag is cleared by the user. It does NOT satisfy Gatekeeper
        # verification and is NOT notarized.
        #
        # Signed INSIDE-OUT (appex executable -> appex bundle -> app), because
        # `codesign --deep` on the outer bundle alone leaves the nested appex with
        # an inconsistent signature and Safari then cannot verify the appex.
        # The entitlement checks below are release blockers on purpose.
        run: |
          set -euo pipefail
          APP="build/App/KISSTranslator.app"
          APPEX="${APP}/Contents/PlugIns/KISSTranslator Extension.appex"
          test -d "${APP}" || { echo "::error::${APP} not found"; exit 1; }
          test -d "${APPEX}" || { echo "::error::${APPEX} not found"; exit 1; }
          xattr -cr "${APP}"
          # `--entitlements` is mandatory: an ad-hoc `codesign --sign -` on a
          # sandboxed bundle DROPS the entitlements (verified locally), leaving the
          # app unable to read the Safari extension state or send Apple Events.
          codesign --force --sign - "${APPEX}/Contents/MacOS/KISSTranslator Extension"
          codesign --force --sign - --entitlements extension/KISSTranslatorExtension.entitlements "${APPEX}"
          codesign --force --sign - --entitlements app/KISSTranslator.entitlements "${APP}"
          codesign --verify --strict --verbose=2 "${APP}"
          codesign --verify --strict --verbose=2 "${APPEX}"
          # Strings are captured first, then matched: `codesign -d | grep -q` under
          # `pipefail` dies of SIGPIPE (141) because grep -q exits early.
          rests() { codesign -d --entitlements - "$1" 2>&1 || true; }
          APP_ENTS="$(rests "${APP}")"
          APPEX_ENTS="$(rests "${APPEX}")"
          grep -c "app-sandbox" <<<"${APPEX_ENTS}" >/dev/null \
            || { echo "::error::${APPEX} lost its entitlements while signing"; exit 1; }
          grep -c "app-sandbox" <<<"${APP_ENTS}" >/dev/null \
            || { echo "::error::${APP} lost its entitlements while signing"; exit 1; }
          grep -c "com.apple.security.automation.apple-events" <<<"${APP_ENTS}" >/dev/null \
            || { echo "::error::the app lost com.apple.security.automation.apple-events"; exit 1; }
          # Hard requirement, not a warning: fail the job instead of shipping an
          # .appex whose signature does not carry the extension identifier.
          APPEX_INFO="$(codesign -dv --verbose=4 "${APPEX}" 2>&1 || true)"
          grep -c "Identifier=com.ftzahao.kisstranslator.extension" <<<"${APPEX_INFO}" >/dev/null \
            || { echo "::error::appex signature does not carry the extension identifier"; echo "${APPEX_INFO}"; exit 1; }
          lipo -info "${APP}/Contents/MacOS/KISSTranslator" || true
          spctl --assess --type execute -vv "${APP}" || true

      - name: Create DMG and ZIP
        run: |
          make dmg SIGNING=0
          ls -l build/dist

      - name: Compute checksums
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd build/dist
          # Fail loudly if the expected artifacts are missing rather than publishing a partial release.
          test -f "KISSTranslator-${VERSION}.dmg" || { echo "::error::KISSTranslator-${VERSION}.dmg not found"; ls -la; exit 1; }
          test -f "KISSTranslator-${VERSION}.zip" || { echo "::error::KISSTranslator-${VERSION}.zip not found"; ls -la; exit 1; }
          shasum -a 256 "KISSTranslator-${VERSION}.dmg" "KISSTranslator-${VERSION}.zip" > checksums.txt
          cat checksums.txt
          # Mirror artifacts at the repo root expected by the upload step below.
          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp "KISSTranslator-${VERSION}.dmg" "KISSTranslator-${VERSION}.zip" checksums.txt "${GITHUB_WORKSPACE}/out/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            build/logs/**
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: KISSTranslator-${{ steps.version.outputs.value }}-unsigned
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          # For workflow_dispatch runs `github.ref_name` is the branch name; the tag must be supplied.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: ${{ format('KISS Translator for Safari {0}', steps.version.outputs.value) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/KISSTranslator-${{ steps.version.outputs.value }}.dmg
            out/KISSTranslator-${{ steps.version.outputs.value }}.zip
            out/checksums.txt
          body: |
            macOS build of the **KISS Translator** Safari Web Extension (upstream ${{ steps.version.outputs.value }}).

            > **This build is UNSIGNED and NOT NOTARIZED.** macOS will warn that the app
            > "cannot be opened because the developer cannot be verified". The app is
            > ad-hoc signed and will run normally once you clear the quarantine flag.
            >
            > **The extension cannot be enabled from this build.** Safari only lists
            > extensions whose containing app is signed with a real Team Identifier
            > (Apple Development or Developer ID); an ad-hoc signature is silently
            > omitted from **Safari → Settings → Extensions**. This DMG lets you run the
            > app and see the onboarding UI, but a working extension requires building
            > from source with your own certificate (see below). Newer onboarding builds
            > detect this and show a warning instead of leaving you hunting for a missing
            > extension.

            ### Install (onboarding UI only)

            1. Download `KISSTranslator-${{ steps.version.outputs.value }}.dmg` (verify it against `checksums.txt`).
            2. Open the DMG and drag **KISS Translator.app** into `/Applications`.
            3. Clear the quarantine attribute (one of):
               - Right-click the app in Finder → **Open** → **Open** again; or
               - Run in Terminal:
                 ```sh
                 xattr -dr com.apple.quarantine "/Applications/KISS Translator.app"
                 ```
            4. Launch the app. It explains how to enable the extension; with this ad-hoc
               build it also warns that Safari will not list it.

            ### Actually using the extension

            Build from source with a real signing team — an Apple Development certificate
            is enough for use on your own Mac:

            ```sh
            git clone https://github.com/ftzahao/kiss-translator-safari
            cd kiss-translator-safari
            make all DEVELOPMENT_TEAM=<YOUR_TEAM_ID>
            ```

            Launch `build/App/KISSTranslator.app` once (this registers the extension),
            then enable **KISS Translator** in **Safari → Settings → Extensions** and
            grant it access to the websites you want translated (manage per-site
            permissions in the same pane, or choose "Always Allow on Every Website").

            ### Verify the download

            ```sh
            shasum -a 256 -c checksums.txt
            ```

            ### Notes

            - The shipped extension version always equals the pinned upstream release
              (`config/build.config.mjs`). Upstream project: https://github.com/fishjar/kiss-translator
            - This is an unofficial, community-packaged derivative work distributed under
              GPL-3.0. Please report packaging issues here, and extension (JS) issues upstream.
            - Xcode / Safari versions are not required to run the app from this DMG;
              building from source requires Xcode 26+ (see `docs/BUILDING.md`).

  # ---------------------------------------------------------------------------
  # Secondary job: .zip containing the .appex, laid out for App Store Connect.
  #
  # NOT SUITABLE FOR DISTRIBUTION AS-IS. This archive is unsigned. Uploading to
  # App Store Connect and passing notarization / App Review requires the owner's
  # own Apple Developer Program membership: a "Developer ID Application" or
  # "Apple Distribution" certificate, an App Store provisioning profile containing
  # the extension's App ID, hardened runtime, and `notarytool` submission with an
  # app-specific password or API key. None of that can be automated in this
  # public workflow because it needs private signing material. Download this
  # artifact, sign + notarize it locally, then upload it with Xcode Organizer or
  # `xcrun altool` / `xcrun notarytool`.
  #
  # The .appex currently bundles an MV3 manifest. Safari on macOS 14+ accepts
  # Web Extension manifests through Xcode's "Safari Web Extension Converter";
  # if the extension fails to load during conversion, run
  # `xcrun safari-web-extension-converter --no-open --no-prompt <appex>` locally
  # and re-sign. This is intentionally not automated.
  # ---------------------------------------------------------------------------
  store-zip:
    name: Build (unsigned store-upload ZIP)
    # Same Liquid Glass requirement as the `build` job above; see the note there.
    runs-on: macos-26
    timeout-minutes: 45
    if: github.ref_type == 'tag' || inputs.include_store_zip || inputs.publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Build (unsigned)
        run: make all SIGNING=0

      - name: Package app for App Store Connect (unsigned)
        run: |
          VERSION=$(node -e 'import("./config/build.config.mjs").then(m => process.stdout.write(m.app.marketingVersion))')
          APP="build/App/KISSTranslator.app"
          test -d "${APP}" || { echo "::error::${APP} not found"; exit 1; }
          test -d "${APP}/Contents/PlugIns/KISSTranslatorExtension.appex" || \
            echo "::warning::Expected .appex at ${APP}/Contents/PlugIns/KISSTranslatorExtension.appex"
          mkdir -p out
          # A store upload ships the .app (with the embedded .appex) zipped with
          # `ditto`, mirroring the layout Xcode Organizer produces.
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "out/UNSIGNED-STORE-UPLOAD-${VERSION}.zip"
          unzip -l "out/UNSIGNED-STORE-UPLOAD-${VERSION}.zip" | head -40

      - name: Upload unsigned store ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-STORE-UPLOAD-must-be-signed-locally
          path: out/UNSIGNED-STORE-UPLOAD-*.zip
          if-no-files-found: error
          retention-days: 30
