name: Feature request
description: Suggest an improvement to the macOS packaging, build, or distribution.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a packaging layer over
        [KISS Translator](https://github.com/fishjar/kiss-translator). Requests for
        **extension features** (new translation services, UI changes, rule
        capabilities, prompt behaviour) should go
        [upstream](https://github.com/fishjar/kiss-translator/issues).

        Good fits here include: signing and notarization, distribution channels,
        build reproducibility, CI improvements, documentation, accessibility of the
        container app, and iOS/iPadOS support.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: This concerns packaging/build/distribution, not the extension's translation features.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or impossible today?
      placeholder: "As a user who ... I cannot ... because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like. Concrete beats vague.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you already tried, or other designs you rejected and why.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation / distribution
        - Code signing / notarization
        - Build pipeline (Makefile, scripts)
        - CI / release workflow
        - Container app (SwiftUI)
        - Documentation
        - iOS / iPadOS support
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, upstream discussions, related issues.
    validations:
      required: false
