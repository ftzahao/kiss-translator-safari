name: Bug report
description: Report a problem with the Safari packaging, installation, or the container app.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report!

        **Before you continue:** if the problem is with translation quality, a
        translation service, or how a page is rendered, it belongs upstream:
        https://github.com/fishjar/kiss-translator/issues — please report it there
        instead (mention that you are on Safari/macOS).

        Please do not use this form for security issues. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a packaging / installation / build problem, not a translation-quality problem.
          required: true
        - label: I am using the latest release or the current `main` branch.
          required: true

  - type: dropdown
    id: install-source
    attributes:
      label: How did you install the extension?
      options:
        - Downloaded DMG/ZIP from Releases
        - Built from source (make all)
        - Running from Xcode
        - Other (explain below)
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`
      placeholder: "14.6"
    validations:
      required: true

  - type: input
    id: safari-version
    attributes:
      label: Safari version
      description: Safari → About Safari
      placeholder: "17.6 (19618.3.11.11.5)"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Release tag or the value of `CFBundleShortVersionString` in the app Info.plist
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: upstream-version
    attributes:
      label: Upstream version
      description: Version shown in the extension's About / settings page
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Mac architecture
      description: Apple Silicon or Intel; output of `uname -m`
      placeholder: "arm64"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Be specific — which menu, which page, which toggle.
      placeholder: |
        1. Open `/Applications/KISS Translator.app`
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include exact error text (in full), screenshots, and console logs if available.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. For launch failures:
        `log show --last 5m --predicate 'process == "KISSTranslator"' --style compact`
      render: shell
    validations:
      required: false
