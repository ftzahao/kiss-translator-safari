blank_issues_enabled: false
contact_links:
  - name: Translation / extension bug (upstream)
    url: https://github.com/fishjar/kiss-translator/issues
    about: Wrong translations, failing services, broken page layout, subtitles, TTS — report these to the upstream project. Mention that you are on Safari/macOS.
  - name: Security vulnerability
    url: https://github.com/ftzahao/kiss-translator-safari/security/advisories/new
    about: Please report security issues privately, never as a public issue. See SECURITY.md.
  - name: Build documentation
    url: https://github.com/ftzahao/kiss-translator-safari/blob/main/docs/BUILDING.md
    about: Prerequisites, make targets, artifact paths and troubleshooting.
